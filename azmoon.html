        function sanitizeObjectKeys(obj) {
            // FIX: Check if the object is a Firestore Timestamp and return it as is to preserve its methods.
            if (obj && typeof obj.toMillis === 'function' && obj.hasOwnProperty('seconds') && obj.hasOwnProperty('nanoseconds')) {
                return obj;
            }
            if (obj === null || typeof obj !== 'object') return obj;
            if (Array.isArray(obj)) return obj.map(item => sanitizeObjectKeys(item));
            const newObj = {};
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    const trimmedKey = key.trim();
                    newObj[trimmedKey] = sanitizeObjectKeys(obj[key]);
                }
            }
            return newObj;
        }

        async function getAIAnalysis(resultData) {

            }).filter(q => q !== null).join('\n');

            const systemPrompt = `
                شما یک مشاور تحصیلی برجسته و متخصص در زمینه آزمون‌های پرستاری روان هستید. تحلیل شما باید کاملاً حرفه‌ای، حمایتگرانه، دقیق و شخصی‌سازی شده باشد. تحلیل خود را به زبان فارسی ارائه دهید و مستقیماً دانشجو را خطاب قرار دهید. از به کار بردن ایموجی خودداری کن.

                **قوانین بسیار مهم که باید رعایت کنی:**
                ۱. **ارجاع به کتاب:** اگر نیاز به معرفی منبع برای مطالعه بیشتر بود، **فقط و فقط** از کتاب‌های زیر استفاده کن و برای هر موضوع به فصل مربوطه ارجاع بده:
                   - "اصول روان پرستاری و بهداشت روان تاوسند"
                   - "کتاب تست اوج روان"
                ۲. **ارجاع برای مشاوره:** اگر نیاز به ارجاع برای برنامه‌ریزی درسی و مشاوره آزمون ارشد بود، دانشجو را به **"آکادمی مسیر (سرکار خانم کلیج)"** ارجاع بده.
                ۳. **ممنوعیت مقیاس‌ها:** به هیچ عنوان به مقیاس‌های روانشناسی (مانند مقیاس اضطراب بک و...) ارجاع نده.
                ۴. **تشویق به آزمون:** در انتهای تحلیل، دانشجو را تشویق کن تا با توجه به شرایط و نقاط ضعف خود، در سایر آزمون‌های موجود در پلتفرم نیز شرکت کند.
            `;
            const userQuery = `یک دانشجوی پرستاری به نام "${resultData.name}" در "${quizData.title}" شرکت کرده است. عملکرد او: - درصد: ${resultData.percentage.toFixed(2)}% - صحیح: ${resultData.correct}, غلط: ${resultData.incorrect}, بی‌پاسخ: ${resultData.unanswered}. لیست سوالات غلط: ${incorrectQuestions || "به هیچ سوالی پاسخ اشتباه نداده است."}. وظیفه شما: 1. یک عنوان جذاب و انگیزشی برای تحلیل بنویس. 2. عملکرد کلی او را در یک پاراگراف کامل تحلیل کن. 3. چند حوزه کلیدی برای مطالعه بیشتر را شناسایی کن. 4. چند راهکار عملی و مشخص (به صورت bullet point) ارائه بده. 5. در انتها یک پیام انگیزشی بنویس و قوانین مهم را رعایت کن.`;

            try {
                // This is a more robust way to construct the URL that allows the platform's automatic key injection to work correctly.
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent`;
                const payload = { contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] }, };
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(`API call failed with status ${response.status}`);

                    let htmlContent = '', inList = false;
                    lines.forEach((line, index) => {
                        line = line.trim();
                        const isListItem = line.startsWith('*') || line.startsWith('•');
                        if (!isListItem && inList) { htmlContent += '</ul>'; inList = false; }
                        if (isListItem && !inList) { htmlContent += '<ul class="list-disc list-inside space-y-2 mb-3">'; inList = true; }
                        if (index === 0 && !isListItem) htmlContent += `<h3 class="text-xl font-bold text-gray-800 mb-4">${line.replace(/#+\s*/, '')}</h3>`;

                    return htmlContent;
                }

                toggleButtonLoading(submitBtn, false, 'ثبت نام');
            }
        };

        const handleLogin = async (e) => {
             e.preventDefault();
            const email = document.getElementById('login-email').value.trim(), password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error'), submitBtn = document.getElementById('login-submit-btn');
            toggleButtonLoading(submitBtn, true, 'ورود');
            errorEl.textContent = '';
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (error) {
                errorEl.textContent = error.code === 'auth/invalid-credential' ? 'ایمیل یا رمز عبور اشتباه است.' : 'خطا در ورود. دوباره تلاش کنید.';
                console.error("Login Error: ", error);
            } finally {
                toggleButtonLoading(submitBtn, false, 'ورود');
            }
        };
        
        async function handlePaymentSubmission(e, quizId) {
            e.preventDefault();
            const ref = document.getElementById('transaction-ref').value.trim();
            if (!ref) { document.getElementById('payment-submit-error').textContent = 'لطفاً کد رهگیری را وارد کنید.'; return; }
            const submitBtn = document.getElementById('submit-payment-btn');
            toggleButtonLoading(submitBtn, true, 'در حال ثبت');
            try {
                await addDoc(collection(db, 'payments'), { userId: currentUser.uid, userName: userProfile.name, userEmail: currentUser.email, quizId, quizTitle: allQuizzes[quizId].title, transactionRef: ref, status: 'pending', timestamp: Timestamp.now() });
                alert('اطلاعات واریز شما با موفقیت ثبت شد. پس از تایید توسط استاد، آزمون برای شما فعال خواهد شد.');
                renderView('studentDashboard');
            } catch (error) {
                console.error("Error submitting payment:", error);
                document.getElementById('payment-submit-error').textContent = 'خطا در ثبت اطلاعات.';
            } finally {
                toggleButtonLoading(submitBtn, false, 'ثبت و انتظار برای تایید');
            }
        }

        function handleQuizSearch(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const quizzesToFilter = Object.entries(allQuizzes);
            
            const filteredQuizzes = quizzesToFilter.filter(([quizId, quizData]) => {
                const titleMatch = quizData.title.toLowerCase().includes(searchTerm);
                const topicMatch = quizData.topics && quizData.topics.some(topic => topic.toLowerCase().includes(searchTerm));
                return titleMatch || topicMatch;
            });

            loadStudentQuizzes(Object.fromEntries(filteredQuizzes), true);
        }
        
        // --- DATA LISTENERS ---
        function listenForQuizzes() {
            if(unsubscribeQuizzesListener) unsubscribeQuizzesListener();
            unsubscribeQuizzesListener = onSnapshot(collection(db, 'quizzes'), (snapshot) => {
                allQuizzes = {};
                snapshot.docs.forEach(doc => allQuizzes[doc.id] = sanitizeObjectKeys(doc.data()));
                const isStudentView = mainContainer.querySelector('#available-quizzes-container'), isAdminView = mainContainer.querySelector('#admin-content');
                if (isStudentView) loadStudentQuizzes();
                else if (isAdminView) handleAdminTabChange(document.querySelector('.admin-tab-btn.active')?.dataset.tab);
            }, (error) => console.error("خطا در خواندن آزمون‌ها:", error));
        }

        function listenForQuizSettings() {
            if(unsubscribeQuizSettingsListener) unsubscribeQuizSettingsListener();
            unsubscribeQuizSettingsListener = onSnapshot(collection(db, 'quiz_settings'), (snapshot) => {
                quizSettings = {};
                snapshot.docs.forEach(doc => quizSettings[doc.id] = sanitizeObjectKeys(doc.data()));
                if (mainContainer.querySelector('#available-quizzes-container')) loadStudentQuizzes();
                if (mainContainer.querySelector('#quiz-management-container')) renderAdminQuizManagement();
                if (mainContainer.querySelector('#admin-prices-container')) renderAdminPriceManagement();
            }, (error) => console.error("Error fetching quiz settings:", error));
        }

        function listenForDiscounts() {
            if(unsubscribeDiscountsListener) unsubscribeDiscountsListener();
            unsubscribeDiscountsListener = onSnapshot(collection(db, 'discount_codes'), (snapshot) => {
                discounts = snapshot.docs.map(doc => ({ id: doc.id, ...sanitizeObjectKeys(doc.data()) }));
                if (mainContainer.querySelector('#admin-discounts-container')) renderAdminDiscounts();
            }, (error) => console.error("Error fetching discounts:", error));
        }

        function listenForUserPayments() {
            if(unsubscribeUserPaymentsListener) unsubscribeUserPaymentsListener();
            unsubscribeUserPaymentsListener = onSnapshot(query(collection(db, 'payments'), where("userId", "==", currentUser.uid)), (snapshot) => {
                userPayments = snapshot.docs.map(doc => sanitizeObjectKeys(doc.data()));
                if (mainContainer.querySelector('#available-quizzes-container')) loadStudentQuizzes();
            }, (error) => console.error("Error fetching user payments:", error));
        }

        // --- STUDENT DASHBOARD LOGIC ---
        async function loadStudentQuizzes(quizzesToDisplay = allQuizzes, isSearch = false) {
            const completedContainer = document.getElementById('completed-quizzes-container');
            if (!isSearch) {
                 const resultsCollection = collection(db, 'quiz_results');
                const q = query(resultsCollection, where("userId", "==", currentUser.uid));
                const snapshot = await getDocs(q);
                const completedResults = snapshot.docs.map(doc => ({ id: doc.id, ...sanitizeObjectKeys(doc.data()) }));

                if (completedContainer) {
                    completedContainer.innerHTML = '';
                    if (completedResults.length > 0) {
                         completedResults.sort((a,b) => a.timestamp.toMillis() - b.timestamp.toMillis()).forEach((res, index) => {
                            completedContainer.innerHTML += `<div class="flex flex-col sm:flex-row justify-between items-center text-center sm:text-right p-4 bg-white border rounded-lg gap-3 animate-stagger-item" style="animation-delay: ${index * 100}ms"><div class="flex-grow"><p class="font-bold">${allQuizzes[res.quizId]?.title || res.quizId}</p><p class="text-sm text-gray-500 mt-1">تاریخ: ${new Date(res.timestamp.seconds * 1000).toLocaleDateString('fa-IR')} - درصد: ${res.percentage.toFixed(2)}%</p></div><div class="flex-shrink-0 mt-3 sm:mt-0"><button data-result-id="${res.id}" class="btn btn-primary text-sm py-1 px-3 view-report-btn">مشاهده کارنامه</button></div></div>`;
                        });
                        document.querySelectorAll('.view-report-btn').forEach(btn => btn.addEventListener('click', (e) => displayResults(completedResults.find(r => r.id === e.target.dataset.resultId), 'student')));
                        if (completedResults.length > 1) {
                            document.getElementById('progress-chart-container').classList.remove('hidden');
                            renderProgressChart(completedResults.map(r => allQuizzes[r.quizId]?.title || r.quizId), completedResults.map(r => r.percentage));
                        }
                    } else { completedContainer.innerHTML = '<p class="text-gray-500 animate-slide-up">هنوز در هیچ آزمونی شرکت نکرده‌اید.</p>'; }
                }
            }
            
            const availableContainer = document.getElementById('available-quizzes-container');
            const completedSnapshot = await getDocs(query(collection(db, 'quiz_results'), where("userId", "==", currentUser.uid)));
            const completedQuizIds = new Set(completedSnapshot.docs.map(r => r.data().quizId));

            if(!availableContainer) return;
            availableContainer.innerHTML = '';
            
            let availableQuizIndex = 0;
            Object.entries(quizzesToDisplay).forEach(([quizId, quizData]) => {
                try {
                     if (!quizData || !quizData.title) return;
                    if (!completedQuizIds.has(quizId)) {
                        const isQuizActive = quizSettings[quizId]?.isActive !== false;
                        const currentPrice = quizSettings[quizId]?.price ?? quizData.price;
                        const payment = userPayments.find(p => p.quizId === quizId);
                        let buttonHtml = '';
                        if (!isQuizActive) buttonHtml = `<button class="btn bg-gray-400 cursor-not-allowed" disabled>غیرفعال</button>`;
                        else if (currentPrice === 0) buttonHtml = `<button data-quiz-id="${quizId}" class="btn btn-primary start-quiz-btn">شروع (رایگان)</button>`;
                        else if (payment?.status === 'approved') buttonHtml = `<button data-quiz-id="${quizId}" class="btn btn-primary start-quiz-btn">شروع آزمون</button>`;
                        else if (payment?.status === 'pending') buttonHtml = `<button class="btn btn-primary" disabled>در انتظار تایید</button>`;
                        else buttonHtml = `<button data-quiz-id="${quizId}" class="btn bg-green-600 hover:bg-green-700 pay-quiz-btn">${currentPrice.toLocaleString('fa-IR')} تومان - پرداخت</button>`;
                        
                        availableContainer.innerHTML += `<div class="flex flex-col sm:flex-row justify-between items-center text-center sm:text-right p-4 border rounded-lg gap-3 transition-all ${!isQuizActive ? 'bg-gray-50 opacity-60' : 'bg-white'} animate-stagger-item" style="animation-delay: ${availableQuizIndex * 100}ms"><div class="flex-grow"><p class="font-bold">${quizData.title}</p>${quizData.topics ? `<div class="flex flex-wrap justify-center sm:justify-start gap-1 mt-2">${quizData.topics.map(topic => `<span class="bg-purple-100 text-purple-800 text-xs font-medium px-2.5 py-0.5 rounded-full">${topic}</span>`).join('')}</div>` : ''}</div><div class="flex-shrink-0 mt-3 sm:mt-0">${buttonHtml}</div></div>`;
                        availableQuizIndex++;
                    }
                } catch (error) { console.error(`خطای پردازش آزمون ${quizId}:`, error); }
            });
            document.querySelectorAll('.start-quiz-btn').forEach(btn => btn.addEventListener('click', (e) => startQuiz(e.target.dataset.quizId)));
            document.querySelectorAll('.pay-quiz-btn').forEach(btn => btn.addEventListener('click', (e) => renderView('paymentInstructions', { quizId: e.target.dataset.quizId })));
            
            if (availableContainer.innerHTML === '') {
                 const searchInput = document.getElementById('quiz-search-input');
                 if (searchInput && searchInput.value) {
                    availableContainer.innerHTML = '<p class="text-gray-500 animate-slide-up">هیچ آزمونی با این مشخصات یافت نشد.</p>';
                 } else {
                    availableContainer.innerHTML = '<p class="text-gray-500 animate-slide-up">آزمون جدیدی برای شرکت وجود ندارد.</p>';
                 }
            }
        }
        
        // --- CHARTING FUNCTIONS ---
        function renderProgressChart(labels, data) {
            const ctx = document.getElementById('progressChart')?.getContext('2d');
            if (!ctx) return;
            if (progressChartInstance) progressChartInstance.destroy();
            progressChartInstance = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'درصد کسب شده', data, borderColor: '#8b5cf6', backgroundColor: 'rgba(139, 92, 246, 0.1)', fill: true, tension: 0.2 }] }, options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } } });
        }
        
        function renderResultPieChart(resultData) {
            const ctx = document.getElementById('resultPieChart')?.getContext('2d');
            if (!ctx) return;
            if (resultPieChartInstance) resultPieChartInstance.destroy();
            resultPieChartInstance = new Chart(ctx, { type: 'doughnut', data: { labels: [`صحیح (${resultData.correct})`, `غلط (${resultData.incorrect})`, `بی‌پاسخ (${resultData.unanswered})`], datasets: [{ data: [resultData.correct, resultData.incorrect, resultData.unanswered], backgroundColor: ['#10b981', '#ef4444', '#9ca3af'], hoverOffset: 4 }] }, options: { responsive: true, plugins: { legend: { position: 'top' } } } });

        // --- ADMIN DASHBOARD LOGIC ---
        function handleAdminTabChange(tabName) {
            document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.admin-tab-btn[data-tab="${tabName}"]`);

            const tabRenderMap = {
                results: { html: `<div class="flex flex-wrap justify-between items-center gap-4 mb-6"><h1 class="text-2xl font-bold text-gray-800">تحلیل نتایج</h1><select id="quiz-filter" class="input-field w-auto"></select></div><div id="admin-stats-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div><div class="bg-white rounded-xl shadow-md overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm text-right text-gray-600"><thead class="text-xs text-gray-700 uppercase bg-gray-100"><tr><th class="px-6 py-4">رتبه</th><th class="px-6 py-4">نام</th><th class="px-6 py-4">درصد</th><th class="px-6 py-4">درصد احتمالی</th><th class="px-6 py-4">کلیک</th><th class="px-6 py-4">کارنامه</th></tr></thead><tbody id="results-table-body" class="divide-y divide-gray-200"></tbody></table></div></div><div class="mt-8"><h2 class="text-2xl font-bold text-gray-800 mb-4">تحلیل سوالات</h2><div id="question-analysis-container" class="space-y-6 bg-white rounded-xl shadow-md p-6"></div></div>`, listener: listenForAdminResults },
                payments: { html: `<div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold text-gray-800">مدیریت پرداخت‌ها</h1></div><div class="border-b border-gray-200 mb-6"><nav class="-mb-px flex space-x-4 rtl:space-x-reverse" aria-label="Tabs"><button data-subtab="pending" class="payment-subtab-btn whitespace-nowrap py-3 px-4 border-b-2 font-medium text-sm">در انتظار تایید</button><button data-subtab="approved" class="payment-subtab-btn whitespace-nowrap py-3 px-4 border-b-2 font-medium text-sm">تایید شده ها</button></nav></div><div id="pending-payments-container" class="space-y-3"></div><div id="approved-payments-container" class="space-y-3 hidden"></div>`, listener: listenForAdminPayments },
                quiz_management: { html: `<div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-bold text-gray-800">فعال/غیرفعال کردن آزمون‌ها</h1></div><div id="quiz-management-container" class="space-y-3"></div>`, renderer: renderAdminQuizManagement },
                discounts: { html: `<div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-bold text-gray-800">مدیریت کدهای تخفیف</h1></div><div id="admin-discounts-container"></div>`, renderer: renderAdminDiscounts },
                prices: { html: `<div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-bold text-gray-800">مدیریت قیمت آزمون‌ها</h1></div><div id="admin-prices-container" class="space-y-3"></div>`, renderer: renderAdminPriceManagement }
            };
            
            const tab = tabRenderMap[tabName];
            if (tab) {
                contentEl.innerHTML = tab.html;
                if (tab.listener) tab.listener();
                else if (tab.renderer) tab.renderer();
            }
        }
        
        function renderAdminQuizManagement() {
            const container = document.getElementById('quiz-management-container');
            if (!container) return;
            container.innerHTML = Object.entries(allQuizzes).map(([quizId, quizData], index) => `<div class="flex justify-between items-center p-4 bg-white border rounded-lg animate-stagger-item" style="animation-delay: ${index * 50}ms"><p class="font-bold">${quizData.title}</p><div class="flex items-center"><span class="w-16 text-center text-sm font-bold transition-colors ${quizSettings[quizId]?.isActive !== false ? 'text-green-600' : 'text-red-600'} status-label">${quizSettings[quizId]?.isActive !== false ? 'فعال' : 'غیرفعال'}</span><label class="relative inline-flex items-center cursor-pointer ml-3"><input type="checkbox" class="sr-only peer quiz-status-toggle" data-quiz-id="${quizId}" ${quizSettings[quizId]?.isActive !== false ? 'checked' : ''}><div class="w-11 h-6 bg-gray-200 rounded-full peer peer-focus:ring-2 peer-focus:ring-purple-300 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div></label></div></div>`).join('');
            document.querySelectorAll('.quiz-status-toggle').forEach(toggle => toggle.addEventListener('change', handleQuizStatusChange));
        }
        
        async function handleQuizStatusChange(e) {
            const quizId = e.target.dataset.quizId, newStatus = e.target.checked;
            const label = e.target.closest('.flex.items-center').querySelector('.status-label');
            if (label) { label.textContent = newStatus ? 'فعال' : 'غیرفعال'; label.classList.toggle('text-green-600', newStatus); label.classList.toggle('text-red-600', !newStatus); }
            try { await setDoc(doc(db, 'quiz_settings', quizId), { isActive: newStatus }, { merge: true }); } 
            catch (error) { console.error("Error updating quiz status:", error); alert('خطا در به‌روزرسانی وضعیت آزمون.'); e.target.checked = !newStatus; if (label) { label.textContent = !newStatus ? 'فعال' : 'غیرفعال'; label.classList.toggle('text-green-600', !newStatus); label.classList.toggle('text-red-600', newStatus); } }
        }

        function renderAdminPriceManagement() {
            const container = document.getElementById('admin-prices-container');
            if (!container) return;
            container.innerHTML = Object.entries(allQuizzes).map(([quizId, quizData], index) => `<div class="flex flex-col sm:flex-row justify-between items-center p-4 bg-white border rounded-lg gap-3 animate-stagger-item" style="animation-delay: ${index * 50}ms"><p class="font-bold flex-grow">${quizData.title}</p><div class="flex items-center gap-2"><input type="number" value="${quizSettings[quizId]?.price ?? quizData.price}" data-quiz-id="${quizId}" class="input-field !w-32 text-center price-input" placeholder="قیمت (تومان)"><button data-quiz-id="${quizId}" class="btn btn-primary px-4 save-price-btn">ذخیره</button></div></div>`).join('');
            document.querySelectorAll('.save-price-btn').forEach(btn => btn.addEventListener('click', handlePriceUpdate));
        }

        async function handlePriceUpdate(e) {
            const quizId = e.target.dataset.quizId;
            const newPrice = parseInt(document.querySelector(`.price-input[data-quiz-id="${quizId}"]`).value);
            if (isNaN(newPrice) || newPrice < 0) { alert('لطفا یک قیمت معتبر وارد کنید.'); return; }
            toggleButtonLoading(e.target, true, 'ذخیره');
            try { await setDoc(doc(db, 'quiz_settings', quizId), { price: newPrice }, { merge: true }); } 
            catch (error) { console.error("Error updating price:", error); alert('خطا در به‌روزرسانی قیمت.'); } 
            finally { toggleButtonLoading(e.target, false, 'ذخیره'); }
        }

        function renderAdminDiscounts() {
            const container = document.getElementById('admin-discounts-container');
            if (!container) return;
            container.innerHTML = `<div class="p-6 bg-white border rounded-lg mb-6 animate-slide-up"><h3 class="text-lg font-bold mb-4">ایجاد کد تخفیف جدید</h3><form id="create-discount-form" class="space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label for="discount-code" class="block text-sm font-medium text-gray-700">کد تخفیف (مثال: BAHAR1405)</label><input type="text" id="discount-code" class="input-field mt-1" required></div><div><label for="discount-percentage" class="block text-sm font-medium text-gray-700">درصد تخفیف (مثال: 20)</label><input type="number" id="discount-percentage" class="input-field mt-1" min="1" max="100" required></div></div><div><p class="block text-sm font-medium text-gray-700 mb-2">آزمون‌های مورد نظر را انتخاب کنید:</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${Object.entries(allQuizzes).map(([quizId, quizData]) => `<label class="flex items-center space-x-2 rtl:space-x-reverse"><input type="checkbox" name="applicableQuizzes" value="${quizId}" class="form-checkbox h-4 w-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"><span>${quizData.title}</span></label>`).join('')}</div></div><div class="text-left"><button type="submit" class="btn btn-primary">ایجاد کد</button></div></form></div><div><h3 class="text-lg font-bold mb-4">کدهای تخفیf موجود</h3><div id="existing-discounts-list" class="space-y-3"></div></div>`;
            const listContainer = document.getElementById('existing-discounts-list');
            if (discounts.length > 0) listContainer.innerHTML = discounts.map((d, index) => `<div class="p-4 bg-gray-50 border rounded-lg flex justify-between items-center animate-stagger-item" style="animation-delay: ${index * 50}ms"><div><p class="font-mono font-bold text-purple-600">${d.code}</p><p class="text-sm text-gray-600">${d.percentage}% تخفیف برای ${d.applicableQuizzes.length} آزمون</p></div><button data-discount-id="${d.id}" class="btn bg-red-500 hover:bg-red-600 text-sm py-1 px-3 delete-discount-btn">حذف</button></div>`).join('');
            else listContainer.innerHTML = '<p class="text-gray-500">هیچ کد تخفیفی وجود ندارد.</p>';
            document.getElementById('create-discount-form').addEventListener('submit', handleCreateDiscount);
            document.querySelectorAll('.delete-discount-btn').forEach(btn => btn.addEventListener('click', handleDeleteDiscount));
        }

        async function handleCreateDiscount(e) {
            e.preventDefault();
            const code = document.getElementById('discount-code').value.trim().toUpperCase();
            const percentage = parseInt(document.getElementById('discount-percentage').value);
            const applicableQuizzes = Array.from(document.querySelectorAll('input[name="applicableQuizzes"]:checked')).map(cb => cb.value);
            if (!code || !percentage || applicableQuizzes.length === 0) { alert('لطفا تمام فیلدها را پر کنید و حداقل یک آزمون انتخاب نمایید.'); return; }
            try { await addDoc(collection(db, 'discount_codes'), { code, percentage, applicableQuizzes }); e.target.reset(); } 
            catch (error) { console.error("Error creating discount:", error); alert('خطا در ایجاد کد تخفیف.'); }
        }

        async function handleDeleteDiscount(e) {
            const discountId = e.target.dataset.discountId;
            try { await deleteDoc(doc(db, 'discount_codes', discountId)); } 
            catch (error) { console.error("Error deleting discount:", error); }
        }

        async function handleApplyDiscount(quizId) {
            const code = document.getElementById('discount-code-input').value.trim().toUpperCase();
            const feedbackEl = document.getElementById('discount-feedback'), amountEl = document.getElementById('payment-amount');
            const originalPrice = quizSettings[quizId]?.price ?? allQuizzes[quizId].price;
            if (!code) { feedbackEl.textContent = 'لطفا یک کد وارد کنید.'; feedbackEl.className = 'text-sm mt-2 h-5 text-red-500'; return; }
            try {
                const querySnapshot = await getDocs(query(collection(db, 'discount_codes'), where("code", "==", code)));
                if (querySnapshot.empty) { throw new Error('نامعتبر'); }
                const discountDoc = querySnapshot.docs[0].data();
                if (discountDoc.applicableQuizzes.includes(quizId)) {
                    const newPrice = originalPrice * (1 - discountDoc.percentage / 100);
                    amountEl.innerHTML = `<span class="line-through text-gray-500 text-2xl">${originalPrice.toLocaleString('fa-IR')}</span> ${Math.round(newPrice).toLocaleString('fa-IR')} تومان`;
                    feedbackEl.textContent = `تخفیف ${discountDoc.percentage}% با موفقیت اعمال شد.`;
                    feedbackEl.className = 'text-sm mt-2 h-5 text-green-600';
                } else { throw new Error('برای این آزمون معتبر نیست'); }
            } catch (error) {
                feedbackEl.textContent = error.message.includes('نامعتبر') ? 'کد تخفیف نامعتبر است.' : 'این کد برای آزمون انتخاب شده معتبر نیست.';
                feedbackEl.className = 'text-sm mt-2 h-5 text-red-500';
                amountEl.textContent = `${originalPrice.toLocaleString('fa-IR')} تومان`;
                console.error("Error applying discount:", error);
            }
        }

        function listenForAdminPayments() {
            unsubscribeAdminListener = onSnapshot(collection(db, 'payments'), (snapshot) => {
                const pendingContainer = document.getElementById('pending-payments-container');
                const approvedContainer = document.getElementById('approved-payments-container');
                if(!pendingContainer || !approvedContainer) return;

                const allPayments = snapshot.docs.map(doc => ({ id: doc.id, ...sanitizeObjectKeys(doc.data()) }));
                
                // PENDING PAYMENTS
                const pendingPayments = allPayments.filter(p => p.status === 'pending');
                 pendingPayments.sort((a, b) => a.timestamp.toMillis() - b.timestamp.toMillis());
                
                if (pendingPayments.length === 0) {
                    pendingContainer.innerHTML = '<p class="text-gray-500">هیچ پرداخت در انتظار تاییدی وجود ندارد.</p>';
                } else {
                    pendingContainer.innerHTML = pendingPayments.map((payment, index) => `
                        <div class="p-4 bg-white border rounded-lg space-y-2 sm:grid sm:grid-cols-4 sm:gap-4 sm:items-center sm:space-y-0 animate-stagger-item" style="animation-delay: ${index * 50}ms">
                            <div><p class="font-bold">${payment.userName}</p><p class="text-xs text-gray-500">${payment.userEmail}</p></div>
                            <div><p class="font-semibold">${payment.quizTitle}</p></div>
                            <div><p class="text-sm font-mono">${payment.transactionRef}</p></div>
                            <div class="pt-2 sm:pt-0 sm:text-left"><button data-payment-id="${payment.id}" class="btn bg-green-500 hover:bg-green-600 approve-payment-btn text-sm py-1 px-3">تایید</button></div>
                        </div>`).join('');
                    document.querySelectorAll('.approve-payment-btn').forEach(btn => btn.addEventListener('click', handleApprovePayment));
                }

                // APPROVED PAYMENTS
                const approvedPayments = allPayments.filter(p => p.status === 'approved');
                approvedPayments.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
                
                if (approvedPayments.length === 0) {
                    approvedContainer.innerHTML = '<p class="text-gray-500">هیچ پرداخت تایید شده‌ای وجود ندارد.</p>';
                } else {
                     approvedContainer.innerHTML = approvedPayments.map((payment, index) => {
                        const paymentDate = new Date(payment.timestamp.seconds * 1000).toLocaleDateString('fa-IR');
                        return `
                        <div class="p-4 bg-white border rounded-lg space-y-2 sm:grid sm:grid-cols-4 sm:gap-4 sm:items-center sm:space-y-0 animate-stagger-item" style="animation-delay: ${index * 50}ms">
                            <div><p class="font-bold">${payment.userName}</p><p class="text-xs text-gray-500">${payment.userEmail}</p></div>
                            <div><p class="font-semibold">${payment.quizTitle}</p></div>
                            <div><p class="text-sm font-mono">${payment.transactionRef}</p></div>
                            <div class="sm:text-left"><p class="text-sm text-green-600 font-semibold">تایید شده در: ${paymentDate}</p></div>
                        </div>`;
                    }).join('');
                }

                // Add event listeners for subtabs
                document.querySelectorAll('.payment-subtab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.payment-subtab-btn').forEach(b => b.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        
                        const subtab = e.currentTarget.dataset.subtab;
                        if (subtab === 'pending') {
                            pendingContainer.classList.remove('hidden');
                            approvedContainer.classList.add('hidden');
                        } else {
                            pendingContainer.classList.add('hidden');
                            approvedContainer.classList.remove('hidden');
                        }
                    });
                });

                // Set the default active tab if none is active
                if (!document.querySelector('.payment-subtab-btn.active')) {
                     document.querySelector('.payment-subtab-btn[data-subtab="pending"]').classList.add('active');
                }
            });
        }
        
        async function handleApprovePayment(e) {
            const btn = e.target, paymentId = btn.dataset.paymentId;
            toggleButtonLoading(btn, true, 'تایید');
            try { await updateDoc(doc(db, 'payments', paymentId), { status: 'approved' }); alert('پرداخت با موفقیت تایید شد.'); } 
            catch (error) { console.error("Error approving payment:", error); alert("خطا در تایید پرداخت."); toggleButtonLoading(btn, false, 'تایید'); }
        }

        function listenForAdminResults() {
             unsubscribeAdminListener = onSnapshot(collection(db, 'quiz_results'), (snapshot) => {
                const filterSelect = document.getElementById('quiz-filter');
                if(!filterSelect) return;
                const allResults = snapshot.docs.map(doc => ({id: doc.id, ...sanitizeObjectKeys(doc.data())}));
                const quizzesInDb = [...new Set(allResults.map(r => r.quizId))].filter(id => allQuizzes[id]);
                filterSelect.innerHTML = quizzesInDb.map(id => `<option value="${id}">${allQuizzes[id].title}</option>`).join('');
                if (quizzesInDb.length === 0) filterSelect.innerHTML = `<option>هنوز نتیجه‌ای ثبت نشده</option>`;
                
                const displayQuizResults = (quizId) => {
                    const tableBody = document.getElementById('results-table-body'), statsCards = document.getElementById('admin-stats-cards'), analysisContainer = document.getElementById('question-analysis-container');
                    if (!tableBody || !statsCards || !analysisContainer) return;
                    if(!quizId) { tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-4">لطفا یک آزمون را انتخاب کنید.</td></tr>`; return; }
                    const resultsForQuiz = allResults.filter(r => r.quizId === quizId);
                    if (resultsForQuiz.length === 0) { tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-4">هنوز نتیجه‌ای برای این آزمون ثبت نشده.</td></tr>`; return; }
                    const totalParticipants = resultsForQuiz.length, avgPercentage = resultsForQuiz.reduce((acc, r) => acc + r.percentage, 0) / totalParticipants;
                    statsCards.innerHTML = `<div class="p-4 bg-white rounded-xl shadow-md text-center animate-slide-up"><p class="text-sm font-semibold text-gray-500">تعداد شرکت‌کنندگان</p><p class="text-3xl font-bold text-purple-600 mt-1">${totalParticipants}</p></div><div class="p-4 bg-white rounded-xl shadow-md text-center animate-slide-up" style="animation-delay: 100ms;"><p class="text-sm font-semibold text-gray-500">میانگین درصد</p><p class="text-3xl font-bold text-green-600 mt-1">${avgPercentage.toFixed(2)}%</p></div>`;
                    resultsForQuiz.sort((a, b) => b.score - a.score);
                    tableBody.innerHTML = resultsForQuiz.map((res, index) => `<tr class="hover:bg-gray-50 transition-colors animate-stagger-item" style="animation-delay: ${index * 50}ms"><td class="px-6 py-4 font-medium">${index + 1}</td><td class="px-6 py-4">${res.name}</td><td class="px-6 py-4">${res.percentage.toFixed(2)}%</td><td class="px-6 py-4">${res.potentialPercentage.toFixed(2)}%</td><td class="px-6 py-4 text-center">${res.adClicked ? '<span class="text-green-500 font-bold">✔️</span>' : '<span class="text-red-500">❌</span>'}</td><td class="px-6 py-4"><button data-result-id="${res.id}" class="btn btn-primary text-xs !py-1 !px-3 view-admin-report-btn">مشاهده</button></td></tr>`).join('');
                    document.querySelectorAll('.view-admin-report-btn').forEach(btn => btn.addEventListener('click', (e) => displayResults(allResults.find(r => r.id === e.currentTarget.dataset.resultId), 'admin')));
                    const quizData = allQuizzes[quizId];
                    analysisContainer.innerHTML = quizData.questions.map((q, index) => `<div><p class="font-semibold mb-2">${index + 1}. ${q.question}</p><div class="space-y-1">${q.options.map((opt, i) => `<div class="flex items-center text-xs gap-4"><div class="flex-1">${opt} (${resultsForQuiz.filter(r => r.answers[index] === i).length})</div><div class="w-1/2 bg-gray-200 rounded-full h-4"><div class="h-4 ${i === q.correctAnswer ? 'bg-green-500' : 'bg-purple-500'}" style="width: ${((resultsForQuiz.filter(r => r.answers[index] === i).length / (resultsForQuiz.filter(r=>r.answers[index]!==null).length || 1)) * 100).toFixed(1)}%"></div></div></div>`).join('')}</div></div>`).join('');
                };
                filterSelect.addEventListener('change', (e) => displayQuizResults(e.target.value));
                displayQuizResults(filterSelect.value || (quizzesInDb.length > 0 ? quizzesInDb[0] : null));
             });
        }
        
        // --- QUIZ AND RESULT LOGIC ---
        function startQuiz(quizId) {
            const quizData = allQuizzes[quizId];
            quizState = { quizId, currentQuestionIndex: 0, userAnswers: new Array(quizData.questions.length).fill(null), totalTimer: null, totalTimeRemaining: quizData.duration * 60 };
            renderView('quiz', { quizId });
            renderQuestion();
            startTimers();
        }

        function renderQuestion() {
            const quizData = allQuizzes[quizState.quizId];
            const question = quizData.questions[quizState.currentQuestionIndex];
            document.getElementById('question-number').textContent = quizState.currentQuestionIndex + 1;
            document.getElementById('question-text').textContent = question.question;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = question.options.map((option, index) => `<div class="option" data-option-index="${index}">${option}</div>`).join('');
            
            const previouslySelected = quizState.userAnswers[quizState.currentQuestionIndex];
            if (previouslySelected !== null) {
                const selectedEl = optionsContainer.querySelector(`[data-option-index="${previouslySelected}"]`);
                if (selectedEl) selectedEl.classList.add('selected');
            }
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const clickedOption = e.currentTarget;
                    const optionIndex = parseInt(clickedOption.dataset.optionIndex);

                    if (clickedOption.classList.contains('selected')) {
                        // If it's already selected, deselect it
                        clickedOption.classList.remove('selected');
                        quizState.userAnswers[quizState.currentQuestionIndex] = null;
                    } else {
                        // If it's not selected, select it (and deselect others)
                        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                        clickedOption.classList.add('selected');
                        quizState.userAnswers[quizState.currentQuestionIndex] = optionIndex;
                    }
                });
            });

            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('previous-btn');
            
            prevBtn.disabled = quizState.currentQuestionIndex === 0;

            if (quizState.currentQuestionIndex === quizData.questions.length - 1) {
                nextBtn.textContent = 'پایان آزمون';
            } else {
                nextBtn.textContent = 'سوال بعدی';
            }

            updateProgressBar();
        }
        
        function updateProgressBar() {
            document.getElementById('progress-bar').style.width = `${((quizState.currentQuestionIndex + 1) / allQuizzes[quizState.quizId].questions.length) * 100}%`;
        }

        function startTimers() {
            const totalTimerEl = document.getElementById('timer');
            quizState.totalTimer = setInterval(() => {
                quizState.totalTimeRemaining--;
                const minutes = Math.floor(quizState.totalTimeRemaining / 60);
                const seconds = quizState.totalTimeRemaining % 60;
                if (totalTimerEl) totalTimerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                if (quizState.totalTimeRemaining <= 0) finishQuiz();
            }, 1000);
        }

        function handleNextQuestion() {
            const quizData = allQuizzes[quizState.quizId];
            if (quizState.currentQuestionIndex < quizData.questions.length - 1) {
                quizState.currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function handlePreviousQuestion() {
            if (quizState.currentQuestionIndex > 0) {
                quizState.currentQuestionIndex--;
                renderQuestion();
            }
        }

        async function finishQuiz() {
            clearInterval(quizState.totalTimer);
            const quizData = allQuizzes[quizState.quizId];
            let correct = 0, incorrect = 0;
            quizState.userAnswers.forEach((answer, index) => { if (answer !== null) { if (answer === quizData.questions[index].correctAnswer) correct++; else incorrect++; } });
            const unanswered = quizData.questions.length - (correct + incorrect);
            const score = (correct * 3) - incorrect;
            const percentage = (score / (quizData.questions.length * 3)) * 100;
            const resultData = { quizId: quizState.quizId, userId: currentUser.uid, userEmail: currentUser.email, name: userProfile.name, answers: quizState.userAnswers, correct, incorrect, unanswered, score, percentage: Math.max(0, percentage), potentialPercentage: Math.max(0, (correct * 3 / (quizData.questions.length * 3)) * 100), totalQuestions: quizData.questions.length, adClicked: false, timestamp: Timestamp.now() };
            const docRef = await addDoc(collection(db, 'quiz_results'), resultData);
            resultData.id = docRef.id;
            displayResults(resultData, 'student');
        }

        async function displayResults(resultData, origin = 'student') {
            const snapshot = await getDocs(query(collection(db, 'quiz_results'), where("quizId", "==", resultData.quizId)));
            const allScoresForThisQuiz = snapshot.docs.map(doc => doc.data().score).sort((a, b) => b - a);
            const rank = allScoresForThisQuiz.indexOf(resultData.score) + 1;
            renderView('result', { resultData, rank: `${rank} از ${allScoresForThisQuiz.length}`, origin });
        }
        
        function renderQuestionReview(resultData) {
            const container = document.getElementById('question-review-container');
            if(!container) return;
            const quizData = allQuizzes[resultData.quizId];
            container.innerHTML = quizData.questions.map((q, index) => {
                const userAnswer = resultData.answers[index];
                let statusClass = 'bg-gray-100 text-gray-800', statusText = 'بی‌پاسخ';
                if (userAnswer !== null) {
                    if (userAnswer === q.correctAnswer) { statusClass = 'bg-green-100 text-green-800'; statusText = 'پاسخ صحیح'; } 
                    else { statusClass = 'bg-red-100 text-red-800'; statusText = 'پاسخ غلط'; }
                }
                return `<div class="p-4 border rounded-lg bg-white"><div class="flex justify-between items-center mb-3"><p class="font-bold">سوال ${index + 1}</p><span class="text-xs font-semibold px-2 py-1 rounded-full ${statusClass}">${statusText}</span></div><p class="mb-4">${q.question}</p><div class="space-y-2 text-sm">${q.options.map((opt, i) => `<div class="p-3 border rounded-md ${i === q.correctAnswer ? 'border-green-500 bg-green-50' : (i === userAnswer ? 'border-red-500 bg-red-50' : 'border-gray-200')}">${opt}</div>`).join('')}</div><div class="mt-4 pt-4 border-t text-sm text-purple-800 bg-purple-50 p-3 rounded-md"><p><strong class="font-semibold">پاسخ تشریحی:</strong> ${q.explanation}</p></div></div>`;
            }).join('');
        }

        // Initial View Render
        renderView('loading');

    </script>
</body>
